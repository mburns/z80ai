# Lint configuration. CI gates on everything selected here; see the "Lint" job
# in .github/workflows/ci.yml.

line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "build", "dist"]
# Roots isort treats as first-party. Replaces a hand-written
# known-first-party list that had already drifted twice.
src = [".", "tools", "tests", "data", "data/clinc150", "data/wikipedia"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes: undefined names, unused imports, broken f-strings
    "B",     # bugbear: mutable defaults, unused loop variables, zip strictness
    "C4",    # comprehension style
    "SIM",   # simplifications
    "UP",    # modern syntax for the Python versions we support
    "I",     # import ordering
    "PERF",  # obvious performance mistakes
    "RUF",   # ruff's own checks
    # Below: families that reported zero (or one auto-fixable) violation when
    # they were adopted, so gating them costs nothing today and stops the
    # regression tomorrow. FURB is why this repo does not also run `refurb`,
    # and PERF above is why it does not run `perflint` - ruff has both.
    "FURB",  # modernisations refurb would find
    "NPY",   # numpy legacy APIs, which matter where CI gates on byte-identity
    "A",     # shadowing a builtin
    "PIE",   # small unnecessary constructs
    "PGH",   # blanket noqa / type: ignore, which warn_unused_ignores relies on
    "TID",   # tidy imports: no relative imports, which the flat layout needs
    "EXE",   # a shebang and the executable bit must agree
    "FLY",   # static str.join that should be an f-string
    "ICN",   # conventional import aliases
    "INT",   # gettext mistakes
    "SLOT",  # __slots__ on subclasses of str/tuple/namedtuple
    "T10",   # a stray breakpoint()
    "LOG",   # logging mistakes
    "G",     # logging format strings
    "DTZ",   # naive datetimes
    "YTT",   # sys.version misuse
    "ASYNC", # blocking calls in async code
]

[lint.per-file-ignores]
# libz80.py is an opcode table: one instruction per line, body on the same
# line, is what makes it readable as a table rather than as code.
"libz80.py" = ["E701", "E702"]
# The example data generators shell out to LLM APIs and are deliberately
# forgiving about which of them are reachable. (No S110 here: the S family is
# not selected, so ignoring one of its rules was dead config.)
"examples/**" = ["E722", "PERF203"]

