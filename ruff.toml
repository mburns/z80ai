# Lint configuration. CI gates on everything selected here; see the "Lint" job
# in .github/workflows/ci.yml.

line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "build", "dist"]
# Roots isort treats as first-party. Replaces a hand-written
# known-first-party list that had already drifted twice.
src = [".", "tools", "tests", "data", "data/clinc150", "data/wikipedia"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes: undefined names, unused imports, broken f-strings
    "B",     # bugbear: mutable defaults, unused loop variables, zip strictness
    "C4",    # comprehension style
    "SIM",   # simplifications
    "UP",    # modern syntax for the Python versions we support
    "I",     # import ordering
    "PERF",  # obvious performance mistakes
    "RUF",   # ruff's own checks
]

[lint.per-file-ignores]
# libz80.py is an opcode table: one instruction per line, body on the same
# line, is what makes it readable as a table rather than as code.
"libz80.py" = ["E701", "E702"]
# The example data generators shell out to LLM APIs and are deliberately
# forgiving about which of them are reachable. (No S110 here: the S family is
# not selected, so ignoring one of its rules was dead config.)
"examples/**" = ["E722", "PERF203"]

