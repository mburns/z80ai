name: CI and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Unfiltered, so pull requests stacked on other feature branches are tested
  # too, not only those targeting main.
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job opts back up to contents: write.
permissions:
  contents: read

# A new push to a PR makes the in-flight run pointless. Pushes to main and tags
# are left alone so no release run is ever cancelled halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEFAULT_PYTHON: '3.12'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Gated: syntax errors, undefined names, broken comparisons. See ruff.toml.
      - name: Check for defects
        run: ruff check --output-format=github .

      # Gated: annotations that contradict the code. tests/test_libnn.py already
      # requires the library modules to be annotated; this checks they are right.
      # See mypy.ini for what is excluded and why.
      - name: Check types
        run: mypy

      # Not gated: debt worth seeing but not worth blocking a merge on. These
      # rules are deliberately *outside* the gated set - this step used to
      # select a subset of the gate, so it printed an empty block every run.
      # Complexity is here rather than gated because the worst offenders are
      # instruction decoders whose branch count is the Z80 ISA's; see the
      # module docstring in tools/disasm.py.
      - name: Style report
        if: always()
        run: |
          {
            echo '### Lint debt (not gated)'
            echo
            echo '```'
            ruff check --select C901,PLR0911,PLR0912,PLR0915,ERA,SLF,FBT,PT \
                       --statistics . || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # One version failing should not hide the result on the others.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q --durations=5

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Reported, not gated. What this is for is spotting a module that quietly
      # stopped being exercised - not for defending a number. The slow tests are
      # skipped because they re-run paths the fast ones already cover, at about
      # four times the cost under coverage.
      - name: Measure coverage
        run: |
          pytest -q -m 'not slow' --cov --cov-report=term-missing \
                 --cov-report=json:coverage.json > coverage.txt || true
          {
            echo '### Coverage (not gated)'
            echo
            python - <<'PY'
          import json
          with open("coverage.json") as fh:
              data = json.load(fh)
          total = data["totals"]["percent_covered"]
          print(f"**{total:.0f}%** overall.\n")
          print("| module | statements | missed | covered |")
          print("|---|---:|---:|---:|")
          rows = sorted(data["files"].items(),
                        key=lambda kv: kv[1]["summary"]["percent_covered"])
          for name, entry in rows[:15]:
              s = entry["summary"]
              print(f"| `{name}` | {s['num_statements']} | "
                    f"{s['missing_lines']} | {s['percent_covered']:.0f}% |")
          PY
            echo
            echo 'Lowest 15. The training code sits near 20% because CI has no'
            echo 'PyTorch, which is deliberate - see requirements-dev.txt.'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and verify artifacts
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build every example for every target
        run: ./build-examples.sh dist

      # The build scripts are pure functions of the model file. If two runs
      # disagree, something has picked up dict ordering, a timestamp or a hash
      # seed, and released binaries would stop matching what anyone can rebuild.
      - name: Check builds are reproducible
        run: |
          ./build-examples.sh dist-repeat > /dev/null
          for artifact in dist/*; do
            cmp "$artifact" "dist-repeat/$(basename "$artifact")" \
              || { echo "::error::$(basename "$artifact") is not reproducible"; exit 1; }
          done
          echo "All artifacts are byte-identical across two builds"
          rm -rf dist-repeat

      # The point of the whole exercise: a binary that assembles but computes
      # the wrong answer must not reach a release. --require-all additionally
      # refuses a dist that is merely incomplete, which is what makes the
      # release step below safe to publish everything it finds.
      - name: Verify artifacts against the reference model
        run: python verify_artifacts.py --dist dist --query HELLO --require-all

      - name: Report artifact sizes
        if: always()
        run: |
          {
            echo '### Artifact sizes'
            echo
            echo '| artifact | bytes | KB |'
            echo '|---|---:|---:|'
            for artifact in dist/*; do
              size=$(wc -c < "$artifact")
              awk -v n="$(basename "$artifact")" -v s="$size" \
                'BEGIN { printf "| `%s` | %s | %.1f |\n", n, s, s / 1024 }'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: z80-binaries
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: z80-binaries
          path: dist/

      # Everything the build job produced, which the verify step has already
      # checked is the whole manifest and nothing but - see --require-all.
      # This used to be a hand-written list, and had drifted: the column-major
      # .COMs and both phrasebooks were built, verified and pinned but never
      # published, while the README told people to download one of them.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
