; Type checking. CI gates on this; see the "Lint" job in .github/workflows/ci.yml.
;
; The annotations were already nearly complete - tests/test_libnn.py has
; required them on the library modules for a while - but nothing checked they
; were *right*. Turning this on found two: libinfer.wrap said it could return an
; int when np.asarray guarantees it cannot, and three places narrowed an
; Optional by testing a different attribute that happened to agree with it.
;
; Now --strict. The earlier note here said it was deliberately not, on the
; grounds that the value was catching annotations that contradict the code
; rather than annotating every local. Closing the gap turned out to be about
; fifty edits, most of them naming what a bare `dict` or `list` held - and it
; found four things the loose settings could not:
;
;   data/wikipedia/ingest.py  pages() documented a 3-tuple and yielded a 4-tuple
;   liboracle.Oracle          `search` had two implementations and no interface,
;                             so nothing checked the second one matched
;   data/baseline.py          two different `nbytes` in one function, one of
;                             which could be None where the other could not
;   data/baseline.py          two getattr() guards for attributes the dataclass
;                             declares, defending against nothing

[mypy]
strict = True
; No python_version pin. It is tempting to set 3.10, the oldest version the
; test matrix covers, but that setting also decides which syntax mypy will
; parse in *third-party stubs* - and numpy's now use PEP 695 `type` statements,
; which it then refuses, on any interpreter. The 3.10 floor is enforced where
; it belongs anyway: ruff's target-version rejects newer syntax, and the matrix
; genuinely runs the suite on 3.10.
; data/ is here because it was not, and the omission was invisible: a
; top-level-only glob silently drops a directory rather than erroring, so
; data/baseline.py, data/lint.py and the two corpus builders went unchecked
; from the day they were written.
files = *.py, tools/*.py, data/**/*.py
; Third-party stubs are patchy - torch's especially - and chasing them would
; drown the signal from first-party code.
ignore_missing_imports = True
; Report an ignore that has stopped being needed, so the two below cannot
; quietly outlive their reasons.
warn_unused_ignores = True
warn_redundant_casts = True

; feedme is the training script and the only torch consumer. torch's stubs type
; Module.__call__ loosely enough that every forward pass looks like an error,
; which is noise about torch rather than about this project.
[mypy-feedme]
ignore_errors = True

[mypy-libqat]
ignore_errors = True

; The example data generators shell out to LLM APIs and are excluded from the
; gated ruff rules for the same reason.
[mypy-examples.*]
ignore_errors = True
